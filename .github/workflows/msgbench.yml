name: msgbench regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  msgbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install brotli/zstd dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libbrotli-dev libzstd-dev

      - name: core -Wconversion gate (no implicit integer conversions)
        run: make wconv

      - name: Round-trip test
        run: make test

      - name: Small-message regression (BCB ratios within 2% of baseline)
        run: make msgbench-check

      - name: mmap prior equivalence (in-memory == mmap, bit-identical + lossless)
        run: make prior-equiv

      - name: landmark prior round-trip lossless (4 scenarios)
        run: make landmark-verify

      - name: structural codec round-trip lossless (binary scenarios)
        run: make structural-verify

      - name: public library API (include/bcb.h) round-trip + corruption detection
        run: make api-test

      - name: multi-thread concurrent encode/decode lossless (thread-safety)
        run: make threads-test
