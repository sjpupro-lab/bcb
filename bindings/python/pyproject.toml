[build-system]
requires = ["setuptools>=64", "cffi>=1.15", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcb"
version = "0.2.0"
description = "BCB — small-message & fixed-record lossless compression with a shared learned prior"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "호시", email = "jahyag@gmail.com" }]
license = { text = "Proprietary — All Rights Reserved" }
keywords = ["compression", "lossless", "iot", "telemetry", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = ["cffi>=1.15"]

[project.urls]
Homepage = "https://github.com/sjpupro-lab/bcb"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bcb"]

# ── multi-platform wheels (cibuildwheel) ─────────────────────────────────────
# Linux + macOS + Windows. The Windows build uses the Win32 file-mapping shim in
# bcb_prior.c (no POSIX mmap). In CI the C sources are vendored into
# bindings/python/_csrc before cibuildwheel runs (cibuildwheel only mounts the
# package dir); locally, build from the repo root so the sources are present:
#   BCB_REPO_ROOT=$PWD python -m cibuildwheel --output-dir wheelhouse bindings/python
[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *_i686"
build-frontend = "build"
# Smoke test: the wheel imports and the native extension loads on every platform
# (incl. Windows). The full round-trip pytest needs a prior built by the C
# toolchain and runs in regular CI, not in the isolated wheel test env.
test-command = "python -c \"import bcb; print(bcb.version())\""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
environment = { BCB_REPO_ROOT = "/project" }

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
